plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
}

repositories {
    maven { url 'https://jitpack.io' }
}

def sonarPropertiesFile = rootProject.file("sonar.properties")
def sonarProperties = new Properties()
if (sonarPropertiesFile.exists()) {
    sonarProperties.load(new FileInputStream(sonarPropertiesFile))
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation libs.junit4
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test

    implementation libs.kotlinx.coroutines.core
    implementation libs.koin.core
}

apply plugin: 'jacoco'
apply from: '../detekt.gradle'

// Pure data holders in domain.model (no logic beyond constructor properties) - excluded so
// coverage reflects tested behavior rather than compiler-generated equals/hashCode/copy/toString.
def pureModelDataClasses = [
    'BatterState',
    'DashboardTile',
    'DpAndFlexConfiguration',
    'GeoLocation',
    'MapInfo',
    'PlayerFieldPosition',
    'PlayerGamesCount',
    'PlayerInLineup',
    'PlayerNumberOverlay',
    'PlayerWithPosition',
    'PositionWithLineup',
    'RosterItem',
    'RosterPlayerStatus',
    'ShirtNumberEntry',
    'TeamRosterSummary',
    'TournamentStatsUiConfig',
    'TournamentWithLineup',
].collect { "**/domain/model/${it}.class" }

jacocoTestReport {
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: pureModelDataClasses)
        })
    )
}
