plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.ksp)
    alias(libs.plugins.room)
}

android {
    compileSdk compileVersion

    defaultConfig {
        minSdk minVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    flavorDimensions 'version'

    productFlavors {
        prod {
            dimension 'version'
            buildConfigField("boolean", "usePrefilledDatabase", "false")
        }

        demo {
            dimension 'version'
            buildConfigField("boolean", "usePrefilledDatabase", "true")
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    namespace 'com.telen.easylineup.repository'
    lint {
        targetSdk targetVersion
        // Warnings fail the build too: the report was cleared to zero, and a gate that only
        // stops on errors lets the warnings pile up again.
        warningsAsErrors true
        // Version checks change whenever a library ships, so they would fail a build nobody
        // touched. Bumps are deliberate (see the minSdk notes in CLAUDE.md).
        disable 'NewerVersionAvailable', 'GradleDependency', 'AndroidGradlePluginVersion'
    }
    buildFeatures {
        buildConfig true
    }
    room {
        schemaDirectory("$projectDir/schemas")
    }
    testOptions {
        targetSdk { version = release(targetVersion) }
    }
    testCoverage {
        jacocoVersion = rootProject.ext.jacocoVersion
    }
}

dependencies {

    implementation libs.room.ktx
    ksp libs.room.compiler
    implementation libs.koin
    implementation libs.timber

    implementation project(path: ':domain')

    testImplementation libs.junit4
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.room.testing
    androidTestImplementation libs.tests.runner
    androidTestImplementation libs.tests.junit
}
