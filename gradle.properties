# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Explicit heaps. CI turns off the JVM's container detection (see .circleci/config.yml), so the JVM
# can't size them from the container's limits on its own there. CI also compiles Kotlin inside the
# Gradle daemon rather than a separate Kotlin daemon, to stay within the large executor's 8 GB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError \
    -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# Still needed: KSP adds its generated sources through the kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin refuses otherwise (checked with KSP 2.3.2).
android.disallowKotlinSourceSets=false
