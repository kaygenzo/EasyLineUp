# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Explicit heaps. CI turns off the JVM's container detection (see .circleci/config.yml), so the JVM
# can't size them from the container's limits on its own there. CI also compiles Kotlin inside the
# Gradle daemon rather than a separate Kotlin daemon, to stay within the large executor's 8 GB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError \
    -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
# Gradle Managed Devices (gradle/test-devices.gradle) boot one emulator at a time: two at once
# would compete for the CI machine's 4 CPUs and the test runs would only get slower and flakier.
android.experimental.testOptions.managedDevices.maxConcurrentDevices=1
# Gradle Managed Devices refuse API 26 and below unless told otherwise. The legacy group tests
# the minSdk (23) on its own nightly, where an older emulator's extra flakiness can't spoil the
# main run.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
# Creating an emulator (download, first cold boot, snapshot) can take longer than AGP's default of
# 10 minutes: API 23's timed out in the repository step of its first CircleCI run, and only went
# through in the app step that followed, its image already downloaded.
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=30
