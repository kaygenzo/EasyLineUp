<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyLineUp screens</title>
<style>
  :root {
    --background: #eef2ec; --surface: #ffffff; --border: #d6ddd5; --text: #0b1d26;
    --muted: #5d6d6f; --accent: #e8571f; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0b1d26; --surface: #16323d; --border: #27464f; --text: #f4f7f2;
      --muted: #a3b4b3; --accent: #ff6a2c; --on-accent: #0b1d26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; padding: 14px 20px;
    background: var(--background); border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 20px; }
  .summary { color: var(--muted); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; }
  fieldset { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; border: 0; }
  legend {
    float: left; margin-right: 4px; padding: 0; color: var(--muted);
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  }
  .chip {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    font-weight: 700;
  }
  .chip:focus-visible, figure button:focus-visible { outline: 2px solid var(--accent); }
  select {
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 13px;
  }
  main { padding: 8px 20px 40px; }
  h2 { margin: 26px 0 10px; font-size: 16px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px; align-items: start;
  }
  figure { margin: 0; }
  figure button {
    display: block; width: 100%; padding: 0; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--surface); cursor: zoom-in;
  }
  img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .empty { margin-top: 30px; color: var(--muted); }
  dialog {
    width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0; padding: 16px;
    border: 0; background: rgba(0, 0, 0, .88); color: #fff;
  }
  dialog[open] { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  dialog img { flex: 1; min-height: 0; width: auto; max-width: 100%; object-fit: contain; }
  .viewer-bar { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .viewer-bar button {
    padding: 5px 12px; border: 1px solid #667; border-radius: 8px;
    background: transparent; color: #fff; font: inherit; cursor: pointer;
  }
  @media (max-width: 520px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    header { position: static; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1>EasyLineUp screens</h1>
  <div class="summary"><span id="count"></span> · generated __GENERATED_AT__</div>
  <div class="filters" id="filters"></div>
</header>
<main id="gallery"></main>
<dialog id="viewer">
  <div class="viewer-bar">
    <button id="previous" aria-label="Previous screenshot">←</button>
    <span id="viewerTitle"></span>
    <button id="next" aria-label="Next screenshot">→</button>
    <button id="close">Close</button>
  </div>
  <img id="viewerImage" alt="">
</dialog>
<script>
  const screens = "__SCREENS__";
  const dimensions = [
    { key: "size", label: "Screen", order: ["small", "phone", "large"] },
    { key: "orientation", label: "Orientation", order: ["portrait", "landscape"] },
    { key: "theme", label: "Theme", order: ["day", "night"] }
  ];
  const rank = screen => dimensions.reduce(
    (total, { key, order }) => total * 10 + order.indexOf(screen[key]),
    0
  );
  screens.sort((a, b) => a.screen.localeCompare(b.screen) || rank(a) - rank(b));
  const title = word => word.charAt(0).toUpperCase() + word.slice(1);
  const screenName = id => title(id.replace(/^\d+_/, "").replaceAll("_", " "));
  const configName = s => `${title(s.size)} · ${title(s.orientation)} · ${title(s.theme)}`;
  const unique = values => [...new Set(values)];

  const selected = {};
  let selectedScreen = "";
  let visible = [];
  let viewerIndex = 0;

  const filters = document.getElementById("filters");
  dimensions.forEach(({ key, label, order }) => {
    const values = order.filter(value => screens.some(s => s[key] === value));
    selected[key] = new Set(values);
    const group = document.createElement("fieldset");
    group.innerHTML = `<legend>${label}</legend>`;
    values.forEach(value => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = title(value);
      chip.setAttribute("aria-pressed", "true");
      chip.addEventListener("click", () => {
        const set = selected[key];
        set.has(value) ? set.delete(value) : set.add(value);
        chip.setAttribute("aria-pressed", set.has(value));
        render();
      });
      group.append(chip);
    });
    filters.append(group);
  });

  const screenFilter = document.createElement("fieldset");
  screenFilter.innerHTML = "<legend>Page</legend>";
  const select = document.createElement("select");
  select.setAttribute("aria-label", "Page");
  select.add(new Option("All pages", ""));
  unique(screens.map(s => s.screen)).forEach(id => select.add(new Option(screenName(id), id)));
  select.addEventListener("change", () => { selectedScreen = select.value; render(); });
  screenFilter.append(select);
  filters.append(screenFilter);

  function render() {
    visible = screens.filter(s =>
      dimensions.every(({ key }) => selected[key].has(s[key])) &&
      (!selectedScreen || s.screen === selectedScreen)
    );
    document.getElementById("count").textContent =
      `${visible.length} of ${screens.length} screenshots`;
    const gallery = document.getElementById("gallery");
    gallery.replaceChildren();
    if (!visible.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No screenshot matches this selection.";
      gallery.append(empty);
      return;
    }
    unique(visible.map(s => s.screen)).forEach(id => {
      const heading = document.createElement("h2");
      heading.textContent = screenName(id);
      const grid = document.createElement("div");
      grid.className = "grid";
      visible.filter(s => s.screen === id).forEach(screen => {
        const figure = document.createElement("figure");
        const button = document.createElement("button");
        const image = new Image(screen.width, screen.height);
        image.src = screen.src;
        image.decoding = "async";
        image.alt = `${screenName(id)}, ${configName(screen)}`;
        button.append(image);
        button.addEventListener("click", () => open(visible.indexOf(screen)));
        const caption = document.createElement("figcaption");
        caption.textContent = configName(screen);
        figure.append(button, caption);
        grid.append(figure);
      });
      gallery.append(heading, grid);
    });
  }

  const viewer = document.getElementById("viewer");
  function show(index) {
    viewerIndex = (index + visible.length) % visible.length;
    const screen = visible[viewerIndex];
    const viewerImage = document.getElementById("viewerImage");
    viewerImage.src = screen.src;
    viewerImage.alt = `${screenName(screen.screen)}, ${configName(screen)}`;
    document.getElementById("viewerTitle").textContent = viewerImage.alt;
  }
  function open(index) { show(index); viewer.showModal(); }
  document.getElementById("previous").addEventListener("click", () => show(viewerIndex - 1));
  document.getElementById("next").addEventListener("click", () => show(viewerIndex + 1));
  document.getElementById("close").addEventListener("click", () => viewer.close());
  viewer.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") show(viewerIndex - 1);
    if (event.key === "ArrowRight") show(viewerIndex + 1);
  });

  render();
</script>
</body>
</html>
