def keystorePropertiesFile = rootProject.file("keystore-upload.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
else {
    // Otherwise read from environment variables, this happens in CI
    keystoreProperties.setProperty("storeFile", "../telen.release.jks")
    keystoreProperties.setProperty("storePassword", "${System.getenv('KEYSTORE_PASSWORD')}")
    keystoreProperties.setProperty("keyAlias", "${System.getenv('KEY_ALIAS')}")
    keystoreProperties.setProperty("keyPassword", "${System.getenv('KEY_PASSWORD')}")
    keystoreProperties.setProperty("debug.storeFile", "../telen.debug.jks")
    keystoreProperties.setProperty("debug.storePassword", "${System.getenv('DEBUG_KEYSTORE_PASSWORD')}")
    keystoreProperties.setProperty("debug.keyAlias", "${System.getenv('DEBUG_KEY_ALIAS')}")
    keystoreProperties.setProperty("debug.keyPassword", "${System.getenv('DEBUG_KEY_PASSWORD')}")
}

// The release keystore only exists in CI: locally, keystore-upload.properties has the debug
// keys alone. Without this check the release signing config reads a null storeFile and every
// Gradle invocation fails at configuration, debug builds included. Where it is missing, the
// release build type stays unsigned - it never falls back to the debug key.
def releaseStorePath = keystoreProperties['storeFile']
def releaseStoreFile = releaseStorePath ? file(releaseStorePath) : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace "com.telen.easylineup"
    compileSdk compileVersion
    defaultConfig {
        applicationId "com.telen.easylineup"
        minSdk minVersion
        targetSdk targetVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // ./gradlew connectedDemoDebugAndroidTest -PscreenGallery also captures the screens for
        // generateScreenGallery (see ScreenGalleryTest); without it, that test is skipped.
        if (project.hasProperty('screenGallery')) {
            testInstrumentationRunnerArguments.put('screenGallery', 'true')
        }
        vectorDrawables.useSupportLibrary true
        buildConfigField "Boolean", "UseBetaTool", "true"
        firebaseAppDistribution {
            serviceCredentialsFile="easylineup-services.json"
            releaseNotesFile="releasenotes.txt"
            testersFile="testers.txt"
        }
    }


    flavorDimensions 'version'

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }

        debug {
            storeFile file(keystoreProperties['debug.storeFile'])
            storePassword keystoreProperties['debug.storePassword']
            keyAlias keystoreProperties['debug.keyAlias']
            keyPassword keystoreProperties['debug.keyPassword']
        }
    }

    productFlavors {
        dev {
            dimension 'version'
            applicationIdSuffix = ".dev"
            matchingFallbacks = ['prod']
            buildConfigField "String", "reportStorageRoot", "\"reports.dev\""
        }
        prod {
            dimension 'version'
            matchingFallbacks = ['prod']
            buildConfigField "String", "reportStorageRoot", "\"reports.prod\""
        }
        demo {
            dimension 'version'
            applicationIdSuffix = ".demo"
            matchingFallbacks = ['demo']
            buildConfigField "String", "reportStorageRoot", "\"reports.demo\""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            versionNameSuffix "-debug"
            firebaseCrashlytics {
                // If you don't need crash reporting for your debug build,
                // you can speed up your build by disabling mapping file uploading.
                mappingFileUploadEnabled false
            }
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("No release keystore found: release builds will be unsigned.")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }
    testCoverage {
        jacocoVersion = rootProject.ext.jacocoVersion
    }
    lint {
        abortOnError false
    }
}

