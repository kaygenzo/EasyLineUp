// espresso-core (androidTestImplementation) pulls androidx.test:core 1.7.0, which wants
// androidx.concurrent:concurrent-futures 1.2.0, while firebase-common strictly pins it to
// 1.1.0 - AGP's cross-classpath "consistent resolution" then fails the androidTest compile
// classpath instead of picking one. Force the higher version for the androidTest configs only,
// since it's a strict-superset-compatible bump confined to test code, not the shipped app.
configurations.matching { it.name.contains("AndroidTest") }.configureEach {
    resolutionStrategy {
        force 'androidx.concurrent:concurrent-futures:1.2.0'
        force 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    }
}

