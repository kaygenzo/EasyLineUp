// Types the Compose compiler should treat as stable although it cannot infer it.
//
// The domain module is not compiled with the Compose compiler, so every one of its models
// (Player, Lineup, PlayerWithPosition...) counts as unstable in a composable's parameters by
// default, and a recomposition then compares them by instance, not by value. They are immutable
// data classes, all val, holding lists nobody changes after building them: stable in fact.
//
// Single levels on purpose: domain.model.tiles holds tile data built in place through a
// MutableMap, which is not stable.
com.telen.easylineup.domain.model.*
com.telen.easylineup.domain.model.export.*

// Read-only collection interfaces: the app builds a new one for each state it emits and never
// changes one once handed to Compose (the one place that did, LineupViewModel's draft, is now a
// value). Without this, every List/Set/Map parameter made its composable unskippable unless
// wrapped in an ImmutableList first.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// Immutable by contract.
android.net.Uri
